
name: Build Main Branch

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build C# Solution
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Find solution file
        id: find-solution
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter "*.csproj" -Recurse |
                      Select-Object -First 1

          if (-not $solution) {
              throw "No csproject file (.csproj) found!"
          }

          Write-Host "Found solution: $($solution.FullName)"

          "SOLUTION_PATH=$($solution.FullName)" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: msbuild "$env:SOLUTION_PATH" /t:Restore

      - name: Build solution
        run: msbuild "$env:SOLUTION_PATH" /p:Configuration=Release
