
name: Build Main Branch

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build C# Solution
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify solution exists
        run: |
          ls Alfa-1-aars-eksamens-projekt
          if (!(Test-Path "./Alfa-1-aars-eksamens-projekt/Alfa-1-aars-eksamens-projekt.sln")) {
            throw "Solution file not found!"
          }

      - name: Restore dependencies
        run: msbuild "./Alfa-1-aars-eksamens-projekt/Alfa-1-aars-eksamens-projekt.sln" /t:Restore

      - name: Build solution
        run: msbuild "./Alfa-1-aars-eksamens-projekt/Alfa-1-aars-eksamens-projekt.sln" /p:Configuration=Release /p:RestorePackages=false

