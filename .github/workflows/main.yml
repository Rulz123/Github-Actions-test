
name: Build Main Branch

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build C# Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify solution exists
        run: |
          ls -la
          test -f "./Alfa-1-aars-eksamens-projekt.sln"

      - name: Restore dependencies
        run: dotnet restore "./Alfa-1-aars-eksamens-projekt.sln"

      - name: Build solution
        run: dotnet build "./Alfa-1-aars-eksamens-projekt.sln" --no-restore --configuration Release
